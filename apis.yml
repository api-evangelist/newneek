name: Newneek
description: >-
  Newneek (뉴닉) is a South Korean knowledge and media platform that makes news and
  current events easy and fun to follow. Founded by Kim So-yeon and operated by
  Newneek Co., Ltd. from Seoul's Mapo district, the company is best known for its
  conversational email newsletter delivered by the mascot "Gosuni," alongside a mobile
  app, a Slack news bot, and active social channels. Newneek is a consumer content
  brand rather than an API producer: it publishes no public developer portal, API
  documentation, or machine-readable API surface. It appears in the API Evangelist
  network as a 500 Global portfolio company, and this profile captures its identity
  and domain-security posture. Enrichment probes found no OpenAPI, well-known, OAuth,
  MCP, or webhook surface to harvest.
